name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The OCR tests read a real scan when these are installed.
      - name: Install Tesseract and Poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check wwwroot holds the pinned PDF.js and fonts
        working-directory: src/Shelf.Api/vendor
        run: |
          npm ci --no-audit --no-fund
          npm run vendor
          if ! git diff --quiet -- ../wwwroot; then
            git diff --stat -- ../wwwroot
            echo "::error::wwwroot does not match src/Shelf.Api/vendor/package.json. Run 'npm ci && npm run vendor' in src/Shelf.Api/vendor and commit the result."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shelf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
