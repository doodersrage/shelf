name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by vendor-updates.yml once it has copied a Dependabot update's files.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The OCR and audiobook chapter tests read real files when these are installed.
      - name: Install Tesseract, Poppler, and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils ffmpeg

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Tesseract, Poppler, ffmpeg, and PulseAudio
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils ffmpeg pulseaudio

      # Firefox plays nothing without a sound server, so the audiobook tests get a silent one.
      - name: Start a silent sound server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent

      - name: Build the app the tests start
        run: dotnet build src/Shelf.Api

      - name: Run the browser tests
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npx playwright test

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check wwwroot holds the pinned PDF.js and fonts
        working-directory: src/Shelf.Api/vendor
        run: |
          npm ci --no-audit --no-fund
          npm run vendor
          if ! git diff --quiet -- ../wwwroot; then
            git diff --stat -- ../wwwroot
            echo "::error::wwwroot does not match src/Shelf.Api/vendor/package.json. Run 'npm ci && npm run vendor' in src/Shelf.Api/vendor and commit the result."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: shelf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building is not enough: a missing blazor.web.js only shows in a running image.
      - name: Start the image and load a page's scripts
        run: .github/scripts/smoke-image.sh shelf:ci
      - name: The image's log
        if: failure()
        run: cat smoke.log || true
      # Releases are published for arm64 as well; this one runs emulated, so it is slower but real.
      - uses: docker/setup-qemu-action@v4
      - name: Build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: shelf:ci-arm64
          cache-from: type=gha
      - name: Start the arm64 image and load a page's scripts
        run: .github/scripts/smoke-image.sh shelf:ci-arm64 linux/arm64
      - name: The arm64 image's log
        if: failure()
        run: cat smoke.log || true
