name: Docs

# Builds the documentation in site/ and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "CHANGELOG.md"
      - "src/Shelf.Api/wwwroot/fonts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
