name: Release

# Push a tag such as v1.2.0 to publish that version: the tests run, the image goes to the
# GitHub container registry, and a GitHub release carries that version's CHANGELOG entry.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [ "$tag" != "$prefix" ]; then
            echo "The tag says $tag but Directory.Build.props says $prefix." >&2
            exit 1
          fi
          echo "number=$tag" >> "$GITHUB_OUTPUT"

      # The tests below are SQLite's only: the whole of CI (PostgreSQL, both browsers, the vendored files, the image)
      # must have passed on this very commit. A tag pushed while CI is still running waits for it.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=""
          for attempt in $(seq 1 30); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$id" ] && break
            sleep 20
          done
          if [ -z "$id" ]; then
            echo "CI never ran on $GITHUB_SHA. Push the commit to main, let CI pass, then tag it." >&2
            exit 1
          fi
          if ! gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status > /dev/null; then
            echo "CI did not pass on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >&2
            exit 1
          fi

      # Only the newest version is latest: tags pushed together finish in any order, and an older one must not win.
      - name: Decide whether this is the latest
        id: latest
        run: |
          git fetch --tags --force --quiet
          newest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "tag=ghcr.io/${{ github.repository_owner }}/shelf:latest" >> "$GITHUB_OUTPUT"
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Tesseract, Poppler, and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils ffmpeg

      - run: dotnet test --configuration Release

      # arm64 too, for a Raspberry Pi, most NAS boxes, and Apple silicon. Only the final stage runs emulated.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and checked here first, so an image that cannot run its pages is never published.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: VERSION=${{ steps.version.outputs.number }}
          tags: shelf:release

      - name: Start the image and load a page's scripts
        run: .github/scripts/smoke-image.sh shelf:release

      - name: Publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shelf:${{ steps.version.outputs.number }}
            ${{ steps.latest.outputs.tag }}

      - name: Write the release notes from CHANGELOG.md
        run: |
          awk -v version="${{ steps.version.outputs.number }}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Shelf ${{ steps.version.outputs.number }}." > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Shelf ${{ steps.version.outputs.number }}" --notes-file notes.md ${{ steps.latest.outputs.flag }}
