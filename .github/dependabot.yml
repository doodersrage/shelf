# Weekly pull requests for out-of-date dependencies, one per area rather than one per package. CI runs on each one.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # PDF.js, JSZip, the barcode reader, and the fonts are copied into wwwroot, so this pull request fails CI until
  # someone runs `npm ci && npm run vendor` in src/Shelf.Api/vendor and commits the copied files.
  - package-ecosystem: npm
    directory: /src/Shelf.Api/vendor
    schedule:
      interval: weekly
    groups:
      vendored:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]
