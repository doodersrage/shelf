# Weekly pull requests for out-of-date dependencies, one per area rather than one per package. CI runs on each one.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
    # Shelf targets .NET 10. A new .NET (and the packages released with it) is a deliberate upgrade, not a weekly
    # bump: the runtime image and the target framework have to move together.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # The .NET images move with the target framework; see the NuGet entry above.
    ignore:
      - dependency-name: "*dotnet/*"
        update-types: ["version-update:semver-major"]

  # PDF.js, JSZip, the barcode reader, and the fonts are copied into wwwroot; vendor-updates.yml copies them into
  # this pull request and runs CI again.
  - package-ecosystem: npm
    directory: /src/Shelf.Api/vendor
    schedule:
      interval: weekly
    groups:
      vendored:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]
